server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: rpsupportgroup
  jackson:
    default-property-inclusion: non_null
  datasource:
    url: ${DB_URL:}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

rp:
  stage: ${RP_STAGE:prod}
  internal:
    api-key: ${INTERNAL_API_KEY:}

logging:
  level:
    root: ${LOG_LEVEL:WARN}
    com.reelypops: ${LOG_LEVEL:INFO}
