server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: rpsupportgroup
  jackson:
    default-property-inclusion: non_null
  datasource:
    url: ${DB_URL:}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

rp:
  stage: ${RP_STAGE:prod}
  internal:
    api-key: ${INTERNAL_API_KEY:}
  # The backend-internal AI vetting tier (marker-auto-discovery M4). Empty base-url = AI discovery OFF (local/test
  # and any stage before the tier is enabled) — the client is a fail-open no-op. The key is rpaigateway's OWN
  # internal key (each service validates its own X-Internal-Api-Key), injected as a task secret per stage.
  aigateway:
    base-url: ${RPAIGATEWAY_BASE_URL:}
    internal-api-key: ${RPAIGATEWAY_INTERNAL_API_KEY:}
    # Per-pass cap on candidate images sent to the vetting tier. Keep in step with the AiDiscoveryService @Value default (60);
    # env-overridable per stage. (Was 24, which silently overrode that 60 default so groups with >24 clusters lost coverage.)
    max-images: ${RP_AIGATEWAY_MAX_IMAGES:60}

logging:
  level:
    root: ${LOG_LEVEL:WARN}
    com.reelypops: ${LOG_LEVEL:INFO}
