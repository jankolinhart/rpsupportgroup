name: Build & Push

on:
  push:
    branches: [DEV, RC, RELEASE]
  pull_request:
    branches: [DEV, RC, RELEASE]

permissions:
  contents: read
  packages: write   # push to GHCR

env:
  GHCR_IMAGE: ghcr.io/jankolinhart/rpsupportgroup

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Run tests & verify coverage
        run: mvn verify

  push-ghcr:
    name: Push to GHCR
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/DEV'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: build
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          SHA=$(git rev-parse --short HEAD)
          IMAGE="${{ env.GHCR_IMAGE }}:${VERSION}-${SHA}"
          # Unique immutable DEV tag (deployable) + floating base tag (latest dev)
          docker build -t "$IMAGE" -t "${{ env.GHCR_IMAGE }}:${VERSION}" .
          docker push "$IMAGE"
          docker push "${{ env.GHCR_IMAGE }}:${VERSION}"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "Pushed $IMAGE"
      - name: Trigger DEV auto-deploy (bump rpdeploy imageRef)
        env:
          GH_TOKEN: ${{ secrets.RP_BOT_TOKEN }}
          SERVICE: ${{ github.event.repository.name }}
          IMAGE: ${{ steps.build.outputs.image }}
        run: |
          PAYLOAD=$(printf '{"event_type":"bump-dev-image","client_payload":{"service":"%s","image":"%s"}}' "$SERVICE" "$IMAGE")
          echo "$PAYLOAD" | gh api repos/jankolinhart/rpdeploy/dispatches --method POST --input -

  # ── RC branch → build x.x.x-RC-<sha>, push GHCR, auto-deploy to TEST ──────────
  push-ghcr-rc:
    name: Push RC to GHCR
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/RC'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push RC
        id: build
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          BASE="${VERSION%%-*}"
          SHA=$(git rev-parse --short HEAD)
          IMAGE="${{ env.GHCR_IMAGE }}:${BASE}-RC-${SHA}"
          # Unique immutable RC tag (deployable) + floating RC tag (latest RC)
          docker build -t "$IMAGE" -t "${{ env.GHCR_IMAGE }}:${BASE}-RC" .
          docker push "$IMAGE"
          docker push "${{ env.GHCR_IMAGE }}:${BASE}-RC"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "Pushed $IMAGE"
      - name: Trigger TEST auto-deploy (bump rpdeploy imageRef)
        env:
          GH_TOKEN: ${{ secrets.RP_BOT_TOKEN }}
          SERVICE: ${{ github.event.repository.name }}
          IMAGE: ${{ steps.build.outputs.image }}
        run: |
          PAYLOAD=$(printf '{"event_type":"bump-test-image","client_payload":{"service":"%s","image":"%s"}}' "$SERVICE" "$IMAGE")
          echo "$PAYLOAD" | gh api repos/jankolinhart/rpdeploy/dispatches --method POST --input -

  # ── RELEASE branch → PROMOTE the TEST-vetted RC image to clean x.x.x (build once) ─
  #    Registry-side retag of the EXACT image running in TEST — no rebuild.
  #    PROD then deploys via MERGE only: set the clean tag as imageRef in rpdeploy
  #    stages/prod/<service>/deployment.yml and merge to main (deploy.yml → Deploy → PROD).
  push-ghcr-release:
    name: Promote RC → RELEASE
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/RELEASE'
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote the RC image tested in TEST → clean release tag
        env:
          GH_TOKEN: ${{ secrets.RP_BOT_TOKEN }}
          SERVICE:  ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          # Source of truth = the exact image real-life tested in the TEST stage:
          RC_REF=$(gh api "repos/jankolinhart/rpdeploy/contents/stages/test/${SERVICE}/deployment.yml" \
                     -H "Accept: application/vnd.github.raw" | awk '/^imageRef:/{print $2}')
          [ -n "$RC_REF" ] || { echo "::error::could not read TEST imageRef for ${SERVICE}"; exit 1; }
          RC_TAG="${RC_REF##*:}"           # e.g. 0.0.2-RC-a1b2c3d
          BASE="${RC_TAG%-RC-*}"          # e.g. 0.0.2  (version inherited from the vetted artifact)
          # Guard: TEST must be running an RC image (enforces tested-before-release)
          case "$RC_TAG" in
            *-RC-*) : ;;
            *) echo "::error::TEST is not running an RC image ($RC_REF); nothing vetted to release"; exit 1 ;;
          esac
          CLEAN="${{ env.GHCR_IMAGE }}:${BASE}"
          # D2 burned-version guard: never overwrite an existing release tag
          if docker buildx imagetools inspect "$CLEAN" >/dev/null 2>&1; then
            echo "::error::$CLEAN already exists — version ${BASE} is burned; bump the version first"
            exit 1
          fi
          # Digest-preserving promote (registry-side, NO rebuild). RC + clean tags coexist.
          docker buildx imagetools create --tag "$CLEAN" "$RC_REF"
          echo "Promoted $RC_REF -> $CLEAN"
