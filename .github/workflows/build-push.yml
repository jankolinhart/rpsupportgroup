name: Build & Push

on:
  push:
    branches: [DEV, RC, RELEASE]
  pull_request:
    branches: [DEV, RC, RELEASE]

permissions:
  contents: read
  packages: write   # push to GHCR

env:
  GHCR_IMAGE: ghcr.io/jankolinhart/rpsupportgroup

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Run tests & verify coverage
        run: mvn verify

  push-ghcr:
    name: Push to GHCR
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/DEV'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: build
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          SHA=$(git rev-parse --short HEAD)
          IMAGE="${{ env.GHCR_IMAGE }}:${VERSION}-${SHA}"
          # Unique immutable DEV tag (deployable) + floating base tag (latest dev)
          docker build -t "$IMAGE" -t "${{ env.GHCR_IMAGE }}:${VERSION}" .
          docker push "$IMAGE"
          docker push "${{ env.GHCR_IMAGE }}:${VERSION}"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "Pushed $IMAGE"
      - name: Trigger DEV auto-deploy (bump rpdeploy imageRef)
        env:
          GH_TOKEN: ${{ secrets.RP_BOT_TOKEN }}
          SERVICE: ${{ github.event.repository.name }}
          IMAGE: ${{ steps.build.outputs.image }}
        run: |
          PAYLOAD=$(printf '{"event_type":"bump-dev-image","client_payload":{"service":"%s","image":"%s"}}' "$SERVICE" "$IMAGE")
          echo "$PAYLOAD" | gh api repos/jankolinhart/rpdeploy/dispatches --method POST --input -

  # ── RC branch → build x.x.x-RC-<sha>, push GHCR, auto-deploy to TEST ──────────
  push-ghcr-rc:
    name: Push RC to GHCR
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/RC'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push RC
        id: build
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          BASE="${VERSION%%-*}"
          SHA=$(git rev-parse --short HEAD)
          IMAGE="${{ env.GHCR_IMAGE }}:${BASE}-RC-${SHA}"
          # Unique immutable RC tag (deployable) + floating RC tag (latest RC)
          docker build -t "$IMAGE" -t "${{ env.GHCR_IMAGE }}:${BASE}-RC" .
          docker push "$IMAGE"
          docker push "${{ env.GHCR_IMAGE }}:${BASE}-RC"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "Pushed $IMAGE"
      - name: Trigger TEST auto-deploy (bump rpdeploy imageRef)
        env:
          GH_TOKEN: ${{ secrets.RP_BOT_TOKEN }}
          SERVICE: ${{ github.event.repository.name }}
          IMAGE: ${{ steps.build.outputs.image }}
        run: |
          PAYLOAD=$(printf '{"event_type":"bump-test-image","client_payload":{"service":"%s","image":"%s"}}' "$SERVICE" "$IMAGE")
          echo "$PAYLOAD" | gh api repos/jankolinhart/rpdeploy/dispatches --method POST --input -

  # ── RELEASE branch → build clean x.x.x, push GHCR, NO auto-deploy (PROD manual) ─
  push-ghcr-release:
    name: Push RELEASE to GHCR
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/RELEASE'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push RELEASE
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          BASE="${VERSION%%-*}"
          IMAGE="${{ env.GHCR_IMAGE }}:${BASE}"
          # Clean release tag (no -SNAPSHOT, no sha) — promoted to PROD manually
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "Pushed $IMAGE"
